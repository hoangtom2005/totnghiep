<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hoàng Tôm Store</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    background:#020205;
    color:#fff;
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    overflow:hidden;

    cursor:default;
}


/* =========================================================
   ROOT
========================================================= */

:root{

    --purple:#7657ff;
    --purple2:#a88cff;

    --blue:#4d7cff;

    --white:#ffffff;

    --gray:#777b8d;

    --dark:#020205;

}


/* =========================================================
   MAIN SCENE
========================================================= */

.scene{

    position:fixed;

    inset:0;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(116,86,255,.17),
            transparent 25%
        ),

        radial-gradient(
            circle at 15% 20%,
            rgba(63,97,255,.08),
            transparent 25%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(168,83,255,.08),
            transparent 25%
        ),

        #020205;
}


/* =========================================================
   AURORA
========================================================= */

.aurora{

    position:absolute;

    width:900px;
    height:500px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-12deg);

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(101,77,255,.13),
            rgba(168,115,255,.2),
            rgba(101,77,255,.13),
            transparent
        );

    filter:blur(80px);

    opacity:.65;

    animation:
        auroraMove
        8s
        ease-in-out
        infinite alternate;
}

@keyframes auroraMove{

    0%{
        transform:
            translate(-55%,-50%)
            rotate(-14deg)
            scale(.9);
    }

    100%{
        transform:
            translate(-45%,-50%)
            rotate(-4deg)
            scale(1.15);
    }

}


/* =========================================================
   GRID
========================================================= */

.grid{

    position:absolute;

    width:200%;
    height:200%;

    left:-50%;
    top:-20%;

    opacity:.18;

    background-image:

        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:
        55px 55px;

    transform:
        perspective(500px)
        rotateX(62deg);

    animation:
        gridMove
        14s
        linear
        infinite;
}

@keyframes gridMove{

    from{
        background-position:
            0 0;
    }

    to{
        background-position:
            0 55px;
    }

}


/* =========================================================
   VIGNETTE
========================================================= */

.vignette{

    position:absolute;

    inset:0;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at center,
            transparent 40%,
            rgba(0,0,0,.55) 100%
        );
}


/* =========================================================
   NOISE
========================================================= */

.noise{

    position:absolute;

    inset:-50%;

    opacity:.035;

    pointer-events:none;

    background-image:

        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");

    animation:
        noiseMove
        .15s
        steps(2)
        infinite;
}

@keyframes noiseMove{

    0%{
        transform:
            translate(0,0);
    }

    25%{
        transform:
            translate(2%,1%);
    }

    50%{
        transform:
            translate(-1%,2%);
    }

    75%{
        transform:
            translate(1%,-2%);
    }

    100%{
        transform:
            translate(0,0);
    }

}


/* =========================================================
   MOUSE LIGHT
========================================================= */

.mouse-light{

    position:absolute;

    width:400px;
    height:400px;

    border-radius:50%;

    pointer-events:none;

    background:

        radial-gradient(
            circle,
            rgba(120,91,255,.13),
            transparent 65%
        );

    transform:
        translate(-50%,-50%);

    transition:
        left .15s ease,
        top .15s ease;
}


/* =========================================================
   PARTICLES
========================================================= */

#particles{

    position:absolute;

    inset:0;

    overflow:hidden;

    pointer-events:none;
}

.particle{

    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px rgba(255,255,255,.8);

    animation:
        particleFloat
        linear
        infinite;
}

@keyframes particleFloat{

    0%{

        transform:
            translate3d(
                0,
                110vh,
                0
            )
            scale(.3);

        opacity:0;

    }

    15%{
        opacity:.7;
    }

    80%{
        opacity:.4;
    }

    100%{

        transform:
            translate3d(
                var(--moveX),
                -20vh,
                0
            )
            scale(1);

        opacity:0;

    }

}


/* =========================================================
   ENERGY RINGS
========================================================= */

.energy{

    position:absolute;

    left:50%;
    top:50%;

    width:600px;
    height:600px;

    transform:
        translate(-50%,-50%);

    pointer-events:none;
}

.ring{

    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;

    border:
        1px solid
        rgba(126,99,255,.22);

    transform:
        translate(-50%,-50%);
}

.ring:nth-child(1){

    width:320px;
    height:320px;

    animation:
        ring1
        8s
        linear
        infinite;
}

.ring:nth-child(2){

    width:420px;
    height:420px;

    border-color:
        rgba(255,255,255,.08);

    animation:
        ring2
        13s
        linear
        infinite;
}

.ring:nth-child(3){

    width:520px;
    height:520px;

    border-style:dashed;

    border-color:
        rgba(119,93,255,.13);

    animation:
        ring1
        18s
        linear
        infinite reverse;
}

.ring:nth-child(4){

    width:610px;
    height:610px;

    border-color:
        rgba(255,255,255,.035);

    animation:
        ring2
        25s
        linear
        infinite;
}

@keyframes ring1{

    from{
        transform:
            translate(-50%,-50%)
            rotate(0);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }

}

@keyframes ring2{

    from{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }

    to{
        transform:
            translate(-50%,-50%)
            rotate(0);
    }

}


/* =========================================================
   CENTER
========================================================= */

.center{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:10;

    perspective:1200px;
}


/* =========================================================
   CONTENT
========================================================= */

.content{

    position:relative;

    text-align:center;

    width:
        min(1000px,90%);

    transform-style:
        preserve-3d;

    transition:
        transform .15s ease-out;
}


/* =========================================================
   TOP LABEL
========================================================= */

.label{

    display:inline-flex;

    align-items:center;

    gap:9px;

    padding:
        8px
        14px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:50px;

    background:
        rgba(255,255,255,.025);

    backdrop-filter:
        blur(10px);

    color:#969aaa;

    font-size:10px;

    letter-spacing:3px;

    text-transform:
        uppercase;

    opacity:0;

    transform:
        translateY(20px);

    animation:
        revealUp
        1s
        .2s
        forwards;
}

.label-dot{

    width:6px;
    height:6px;

    border-radius:50%;

    background:
        var(--purple2);

    box-shadow:
        0 0 12px
        var(--purple);

    animation:
        dotPulse
        1.2s
        infinite;
}

@keyframes dotPulse{

    0%,100%{
        opacity:1;
        transform:scale(1);
    }

    50%{
        opacity:.4;
        transform:scale(.6);
    }

}


/* =========================================================
   LOGO
========================================================= */

.logo-wrap{

    position:relative;

    width:130px;
    height:130px;

    margin:
        30px auto;

    opacity:0;

    transform:
        scale(.6)
        rotateX(30deg);

    animation:
        logoReveal
        1.2s
        .5s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

.logo{

    position:absolute;

    inset:12px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:34px;

    background:

        linear-gradient(
            145deg,
            #171325,
            #090812
        );

    border:
        1px solid
        rgba(255,255,255,.16);

    box-shadow:

        inset 0 1px
        rgba(255,255,255,.08),

        0 25px 80px
        rgba(0,0,0,.6),

        0 0 60px
        rgba(106,77,255,.25);

    font-size:38px;

    font-weight:900;

    letter-spacing:-4px;
}

.logo:before{

    content:"";

    position:absolute;

    inset:-1px;

    border-radius:34px;

    background:

        linear-gradient(
            120deg,
            transparent 30%,
            rgba(255,255,255,.5),
            transparent 70%
        );

    opacity:.35;

    mask:
        linear-gradient(#000 0 0)
        content-box;

    padding:1px;

    pointer-events:none;
}

.logo-ring{

    position:absolute;

    inset:-15px;

    border-radius:50%;

    border:
        1px solid
        rgba(120,91,255,.35);

    border-top-color:
        rgba(255,255,255,.8);

    animation:
        logoSpin
        4s
        linear
        infinite;
}

.logo-ring:nth-child(2){

    inset:-25px;

    border:
        1px dashed
        rgba(120,91,255,.16);

    animation:
        logoSpin
        9s
        linear
        infinite reverse;
}

@keyframes logoSpin{

    to{
        transform:
            rotate(360deg);
    }

}

@keyframes logoReveal{

    to{

        opacity:1;

        transform:
            scale(1)
            rotateX(0);

    }

}


/* =========================================================
   TITLE
========================================================= */

.title{

    font-size:
        clamp(
            55px,
            9vw,
            110px
        );

    line-height:.85;

    font-weight:900;

    letter-spacing:
        -7px;

    text-transform:
        uppercase;

    perspective:
        800px;

    opacity:0;

    animation:
        titleReveal
        1.4s
        1s
        cubic-bezier(.16,1,.3,1)
        forwards;
}

.title-line{

    display:block;

    overflow:hidden;

    padding:
        8px 0;
}

.title-line span{

    display:inline-block;

    transform:
        translateY(110%);

    animation:
        textUp
        1.2s
        cubic-bezier(.16,1,.3,1)
        forwards;
}

.title-line:nth-child(1) span{

    animation-delay:
        1.05s;
}

.title-line:nth-child(2) span{

    animation-delay:
        1.15s;
}

.white{

    color:#fff;

    text-shadow:
        0 0 50px
        rgba(255,255,255,.08);
}

.gradient{

    color:transparent;

    background:

        linear-gradient(
            90deg,
            #6e52ff,
            #ad91ff,
            #fff,
            #795dff
        );

    background-size:
        250% auto;

    -webkit-background-clip:
        text;

    background-clip:
        text;

    animation:
        textUp 1.2s
        cubic-bezier(.16,1,.3,1)
        forwards,
        gradientMove
        5s
        linear
        infinite;
}

@keyframes titleReveal{

    to{
        opacity:1;
    }

}

@keyframes textUp{

    to{
        transform:
            translateY(0);
    }

}

@keyframes gradientMove{

    0%{
        background-position:
            0% 50%;
    }

    100%{
        background-position:
            250% 50%;
    }

}


/* =========================================================
   DESCRIPTION
========================================================= */

.description{

    margin-top:22px;

    color:#73778a;

    font-size:12px;

    letter-spacing:4px;

    text-transform:
        uppercase;

    opacity:0;

    animation:
        revealUp
        1s
        1.7s
        forwards;
}

@keyframes revealUp{

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   ENTER BUTTON
========================================================= */

.enter{

    position:relative;

    margin:
        38px auto 0;

    width:
        210px;

    height:
        52px;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:12px;

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius:
        50px;

    background:
        rgba(255,255,255,.035);

    color:#fff;

    font-size:10px;

    font-weight:700;

    letter-spacing:3px;

    text-transform:
        uppercase;

    cursor:pointer;

    overflow:hidden;

    opacity:0;

    animation:
        revealUp
        1s
        2s
        forwards;

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}

.enter:before{

    content:"";

    position:absolute;

    width:0;
    height:100%;

    left:50%;
    top:0;

    transform:
        translateX(-50%);

    background:
        linear-gradient(
            90deg,
            #674dff,
            #a78cff
        );

    transition:
        width .4s ease;

    z-index:-1;
}

.enter:hover{

    transform:
        translateY(-3px);

    border-color:
        rgba(255,255,255,.4);

    box-shadow:
        0 15px 50px
        rgba(103,77,255,.3);
}

.enter:hover:before{

    width:100%;
}

.arrow{

    transition:
        transform .3s ease;
}

.enter:hover .arrow{

    transform:
        translateX(5px);
}


/* =========================================================
   SIDE INFORMATION
========================================================= */

.side-left,
.side-right{

    position:absolute;

    bottom:35px;

    color:#3f4250;

    font-size:9px;

    letter-spacing:2px;

    z-index:20;

    opacity:0;

    animation:
        revealUp
        1s
        2.2s
        forwards;
}

.side-left{
    left:40px;
}

.side-right{
    right:40px;
}


/* =========================================================
   SCAN LINE
========================================================= */

.scan{

    position:absolute;

    width:100%;

    height:1px;

    left:0;

    top:-5%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(155,130,255,.5),
            transparent
        );

    box-shadow:
        0 0 20px
        rgba(120,90,255,.5);

    animation:
        scanMove
        7s
        linear
        infinite;
}

@keyframes scanMove{

    from{
        top:-5%;
    }

    to{
        top:105%;
    }

}


/* =========================================================
   EXIT
========================================================= */

body.exit .content{

    animation:
        exitContent
        .9s
        cubic-bezier(.7,0,.3,1)
        forwards;
}

body.exit .energy{

    animation:
        energyExit
        .8s
        forwards;
}

body.exit .scene{

    animation:
        fadeOut
        1s
        forwards;
}

@keyframes exitContent{

    0%{
        opacity:1;
        transform:
            scale(1);
    }

    100%{
        opacity:0;
        transform:
            scale(1.18)
            translateY(-20px);

        filter:
            blur(12px);
    }

}

@keyframes energyExit{

    to{
        transform:
            translate(-50%,-50%)
            scale(2.5);

        opacity:0;
    }

}

@keyframes fadeOut{

    to{
        opacity:0;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .energy{
        width:420px;
        height:420px;
    }

    .ring:nth-child(1){
        width:240px;
        height:240px;
    }

    .ring:nth-child(2){
        width:310px;
        height:310px;
    }

    .ring:nth-child(3){
        width:380px;
        height:380px;
    }

    .ring:nth-child(4){
        width:440px;
        height:440px;
    }

    .logo-wrap{
        width:100px;
        height:100px;
    }

    .logo{
        inset:9px;
        border-radius:27px;
        font-size:30px;
    }

    .title{

        font-size:
            clamp(
                45px,
                13vw,
                75px
            );

        letter-spacing:
            -4px;
    }

    .description{

        font-size:8px;

        letter-spacing:
            2px;
    }

    .side-left,
    .side-right{
        display:none;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *:before,
    *:after{

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition:
            none !important;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="scene">

    <div class="aurora"></div>

    <div class="grid"></div>

    <div id="particles"></div>

    <div class="energy">

        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>

    </div>

    <div
        class="mouse-light"
        id="mouseLight">
    </div>

    <div class="scan"></div>

    <div class="vignette"></div>

    <div class="noise"></div>

</div>


<!-- =======================================================
     MAIN
======================================================= -->

<div class="center">

    <div
        class="content"
        id="content">


        <!-- LABEL -->

        <div class="label">

            <span class="label-dot"></span>

            OFFICIAL STORE

        </div>


        <!-- LOGO -->

        <div class="logo-wrap">

            <div class="logo-ring"></div>

            <div class="logo-ring"></div>

            <div class="logo">
                HT
            </div>

        </div>


        <!-- TITLE -->

        <div class="title">

            <div class="title-line">

                <span class="white">
                    HOÀNG
                </span>

            </div>


            <div class="title-line">

                <span class="gradient">
                    TÔM STORE
                </span>

            </div>

        </div>


        <!-- DESCRIPTION -->

        <div class="description">

            PREMIUM DIGITAL SHOPPING EXPERIENCE

        </div>


        <!-- BUTTON -->

        <button
            class="enter"
            id="enterButton">

            ENTER STORE

            <span class="arrow">
                →
            </span>

        </button>


    </div>

</div>


<!-- =======================================================
     SIDE TEXT
======================================================= -->

<div class="side-left">

    EST. 2026

</div>


<div class="side-right">

    PREMIUM / DIGITAL / STORE

</div>


<script>

/* =========================================================
   PARTICLES
========================================================= */

const particleContainer =
    document.getElementById(
        "particles"
    );


const particleCount =
    window.innerWidth < 700
        ? 55
        : 110;


for(
    let i = 0;
    i < particleCount;
    i++
){

    const p =
        document.createElement(
            "div"
        );

    p.className =
        "particle";


    const size =
        Math.random() < .8
            ? 1
            : 2;


    p.style.width =
        size + "px";

    p.style.height =
        size + "px";


    p.style.left =
        Math.random() * 100 + "%";


    p.style.setProperty(
        "--moveX",
        (
            Math.random() * 220
            - 110
        ) + "px"
    );


    p.style.animationDuration =
        (
            Math.random() * 8
            + 5
        ) + "s";


    p.style.animationDelay =
        (
            -Math.random() * 12
        ) + "s";


    p.style.opacity =
        (
            Math.random() * .6
            + .1
        );


    particleContainer.appendChild(
        p
    );

}


/* =========================================================
   MOUSE LIGHT
========================================================= */

const mouseLight =
    document.getElementById(
        "mouseLight"
    );


const content =
    document.getElementById(
        "content"
    );


document.addEventListener(
    "mousemove",
    event => {

        const x =
            event.clientX;

        const y =
            event.clientY;


        mouseLight.style.left =
            x + "px";

        mouseLight.style.top =
            y + "px";


        if(
            window.innerWidth > 700
        ){

            const centerX =
                window.innerWidth / 2;

            const centerY =
                window.innerHeight / 2;


            const rotateY =
                (
                    x - centerX
                )
                / centerX
                * 4;


            const rotateX =
                -(
                    y - centerY
                )
                / centerY
                * 3;


            content.style.transform =
                `
                rotateX(${rotateX}deg)
                rotateY(${rotateY}deg)
                `;
        }

    }
);


/* =========================================================
   RESET WHEN MOUSE LEAVES
========================================================= */

document.addEventListener(
    "mouseleave",
    () => {

        content.style.transform =
            "rotateX(0deg) rotateY(0deg)";

    }
);


/* =========================================================
   ENTER STORE
========================================================= */

let leaving =
    false;


function enterStore(){

    if(leaving)
        return;

    leaving = true;

    // Đánh dấu đã xem intro để index.html không đá ngược về intro
    sessionStorage.setItem("introDone", "1");

    document.body.classList.add("exit");

    setTimeout(
        () => {
            window.location.replace("./index.html");
        },
        900
    );

}


document.getElementById(
    "enterButton"
).addEventListener(
    "click",
    enterStore
);


/* =========================================================
   AUTO ENTER
========================================================= */

setTimeout(
    () => {

        enterStore();

    },
    7000
);

</script>

</body>
</html>
